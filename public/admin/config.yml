# Сгенерировано scripts/gen-cms-config.mjs, не править вручную (JSON = валидный YAML)
{
  "backend": {
    "name": "github",
    "repo": "takedown-desing/maniglia-shop",
    "branch": "main",
    "skip_ci": true,
    "commit_messages": {
      "create": "Админка: добавлен {{collection}} «{{slug}}»",
      "update": "Админка: изменён {{collection}} «{{slug}}»",
      "delete": "Админка: удалён {{collection}} «{{slug}}»",
      "uploadMedia": "Админка: загружен файл {{path}}",
      "deleteMedia": "Админка: удалён файл {{path}}"
    }
  },
  "site_url": "https://takedown-desing.github.io/maniglia-shop/",
  "display_url": "https://takedown-desing.github.io/maniglia-shop/",
  "logo": {
    "src": "https://takedown-desing.github.io/maniglia-shop/favicon.svg"
  },
  "media_folder": "public/images/uploads",
  "public_folder": "/images/uploads",
  "slug": {
    "encoding": "unicode",
    "clean_accents": false,
    "sanitize_replacement": "-"
  },
  "collections": [
    {
      "name": "products",
      "label": "Товары",
      "label_singular": "Товар",
      "folder": "src/cms/products",
      "create": true,
      "format": "json",
      "extension": "json",
      "identifier_field": "name",
      "slug": {
        "template": "{{name}}",
        "editable": true
      },
      "preview_path": "maniglia-shop/go/products/{{slug}}/",
      "summary": "{{name}}",
      "sortable_fields": [
        "name",
        "brand",
        "order",
        "category"
      ],
      "view_groups": [
        {
          "label": "По бренду",
          "field": "brand"
        },
        {
          "label": "По разделу",
          "field": "category"
        },
        {
          "label": "Скрытые",
          "field": "hidden"
        }
      ],
      "view_filters": [
        {
          "label": "Скрытые с сайта",
          "field": "hidden",
          "pattern": true
        },
        {
          "label": "Стартовые бренды (Colombo, TUPAI)",
          "field": "brand",
          "pattern": "^(colombo-design|tupai)$"
        }
      ],
      "description": "Карточка товара. Обязательно только название; адрес, если не задан, сформируется из названия. Товар появится на сайте, когда у него будет хотя бы одно фото.",
      "fields": [
        {
          "name": "name",
          "label": "Название",
          "widget": "string",
          "required": true,
          "hint": "Без покрытия: «Дверная ручка Colombo Design Robot CD41RSB на круглой розетке»"
        },
        {
          "name": "slug",
          "label": "Адрес страницы (URL)",
          "widget": "string",
          "required": false,
          "hint": "Страница товара: /product/<адрес>/. Если пусто, адрес сформируется из названия транслитом. Смена адреса опубликованного товара ломает старые ссылки на него"
        },
        {
          "name": "h1",
          "label": "Заголовок H1 (если отличается от названия)",
          "widget": "string",
          "required": false
        },
        {
          "name": "title",
          "label": "Title (заголовок вкладки)",
          "widget": "string",
          "required": false,
          "hint": "Если пусто, собирается автоматически: «Название, покрытие: купить, цена»"
        },
        {
          "name": "metaDescription",
          "label": "Description (описание для поиска)",
          "widget": "text",
          "required": false,
          "hint": "Если пусто, собирается автоматически из названия, бренда и цены"
        },
        {
          "name": "brand",
          "label": "Бренд",
          "widget": "relation",
          "collection": "brands",
          "value_field": "{{slug}}",
          "search_fields": [
            "name"
          ],
          "display_fields": [
            "{{name}}"
          ],
          "required": false
        },
        {
          "name": "series",
          "label": "Серия / коллекция",
          "widget": "string",
          "required": false
        },
        {
          "name": "category",
          "label": "Раздел каталога",
          "widget": "relation",
          "collection": "sections",
          "value_field": "{{slug}}",
          "search_fields": [
            "title",
            "h1",
            "slug"
          ],
          "display_fields": [
            "{{title}}"
          ],
          "required": false,
          "hint": "Основной раздел: по нему строятся хлебные крошки. Новый раздел создаётся в «Разделы каталога»"
        },
        {
          "name": "extraCategories",
          "label": "Дополнительные разделы",
          "widget": "relation",
          "collection": "sections",
          "value_field": "{{slug}}",
          "search_fields": [
            "title",
            "h1",
            "slug"
          ],
          "display_fields": [
            "{{title}}"
          ],
          "required": false,
          "multiple": true,
          "hint": "Товар покажется и в этих разделах (например, в новой подборке)"
        },
        {
          "name": "article",
          "label": "Артикул модели",
          "widget": "string",
          "required": false
        },
        {
          "name": "order",
          "label": "Порядок в листинге",
          "widget": "number",
          "value_type": "int",
          "required": false,
          "hint": "Меньше = выше. У существующих товаров 1–515, новые по умолчанию в конце"
        },
        {
          "name": "hidden",
          "label": "Скрыть с сайта",
          "widget": "boolean",
          "default": false,
          "required": false,
          "hint": "Товар остаётся в админке, но не публикуется"
        },
        {
          "name": "hiddenNote",
          "label": "Почему скрыт",
          "widget": "string",
          "required": false
        },
        {
          "name": "variants",
          "label": "Варианты покрытий",
          "label_singular": "Покрытие",
          "widget": "list",
          "required": false,
          "collapsed": false,
          "summary": "{{fields.finish}} · {{fields.price}} ₽",
          "hint": "Товар выводится на сайт, когда есть хотя бы один вариант с фото. Первый вариант с фото становится главным в карточке",
          "fields": [
            {
              "name": "finish",
              "label": "Покрытие (как на сайте)",
              "widget": "string",
              "required": false,
              "hint": "например: матовый чёрный"
            },
            {
              "name": "color",
              "label": "Группа цвета (для фильтра)",
              "widget": "select",
              "options": [
                {
                  "label": "чёрный",
                  "value": "black"
                },
                {
                  "label": "хром",
                  "value": "chrome"
                },
                {
                  "label": "золото",
                  "value": "gold"
                },
                {
                  "label": "бронза",
                  "value": "bronze"
                },
                {
                  "label": "никель",
                  "value": "nickel"
                },
                {
                  "label": "латунь",
                  "value": "brass"
                },
                {
                  "label": "белый",
                  "value": "white"
                },
                {
                  "label": "графит",
                  "value": "graphite"
                },
                {
                  "label": "медь",
                  "value": "copper"
                },
                {
                  "label": "серебро",
                  "value": "silver"
                },
                {
                  "label": "другое",
                  "value": "other"
                }
              ],
              "required": false,
              "default": "other"
