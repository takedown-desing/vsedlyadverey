            {
              "name": "article",
              "label": "Артикул варианта",
              "widget": "string",
              "required": false
            },
            {
              "name": "price",
              "label": "Цена, ₽",
              "widget": "number",
              "value_type": "int",
              "required": false,
              "hint": "Пусто = «Цена по запросу»"
            },
            {
              "name": "inStock",
