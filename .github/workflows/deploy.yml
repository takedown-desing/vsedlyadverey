name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # кнопка «Publish Changes» в админке (/admin/, Sveltia CMS)
  repository_dispatch:
    types: [sveltia-cms-publish]
permissions:
  contents: write   # сохранение карты адресов и редиректов после сборки
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # карта адресов и автоматические редиректы: следующая сборка сравнит адреса и поставит переадресации со старых
      - name: Save URL map and redirects
        run: |
          if [ -n "$(git status --porcelain -- src/cms/settings/url-map.json src/cms/settings/redirects-auto.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/cms/settings/url-map.json src/cms/settings/redirects-auto.json
            git commit -m "Карта адресов и редиректы [skip ci]"
            git pull --rebase origin main && git push origin HEAD:main || echo "::warning::карта адресов не сохранена, будет пересчитана при следующей сборке"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
